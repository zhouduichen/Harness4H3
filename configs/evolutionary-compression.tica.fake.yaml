# Explicit opt-in CPU Fake TICA-Prune research run. This output root is
# separate from the legacy evolutionary-compression experiments.
backend: fake
checkpoint: fake://baseline
output_root: ../var/evolutionary-compression-tica-fake
device: cpu
dtype: float32
local_files_only: true
fake:
  block_count: 4
  hidden_size: 8
  ffn_width: 16
  seed: 7
sandbox_timeout_s: 10
exploit_ratio: 0.7
seed: 7
advanced_profiling: true
algorithm_improvement: true
candidate_screening: true
tica_prune: true
tica_recipe:
  time_weight_formula: early_log
  risk_limit: 0.25
  fast_risk_limit: 0.50
  activation_weight: 0.5
  interaction_weight: 0.5
  beam_width: 2
  max_fast_evals: 8
  max_full_evals: 4
  max_interaction_evals: 2
controller:
  provider: deterministic
evaluator:
  backend: structural_proxy
