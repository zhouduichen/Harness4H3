    # retaining ordinary textured Teacher/Student frames.
    min_spatial_gradient: 0.30
    min_laplacian_std: 1.8
    min_block_variance: 12.0
    min_frame_difference: 0.01
    max_low_texture_frame_ratio: 0.25
  controller_search_space:
    learning_rate: [0.000001, 0.000003, 0.00001, 0.00003]
    critic_learning_rate: [0.000001, 0.000003, 0.00001, 0.00003]
    rollout_endpoint_weight: [0.25, 0.5, 1.0]
