schema_version: 1
quality_scope: structural_proxy
research_grade: true

controller_review:
  interval_s: 60
  max_calls: 512
  max_context_observations: 24
  max_iterations: 64

remote:
  host: Jiayu-intern
  ssh_port: 30902
  harness_root: /home/intern/huangjiahao/Harness4H3-rsi
  model_root: /data/models/MiniMax-H3
  comfyui_root: /home/intern/huangjiahao/ComfyUI
  comfyui_port: 8188
  python: /home/intern/miniconda3/envs/comfy/bin/python
  training_python: /home/intern/miniconda3/envs/comfy/bin/torchrun
  results_root: /home/intern/huangjiahao/Harness4H3-rsi/work/remote-h3-controller-20260914
  deployment_dir: /home/intern/huangjiahao/ComfyUI/models/diffusion_models
  campaign_root: /home/intern/huangjiahao/Harness4H3-rsi/work/remote-h3-controller-20260914

workflow:
  template: ../examples/remote_linux_h3_workflow_api.json
  prompt_target: {node_id: "139", input: prompt}
  seed_target: {node_id: "137", input: noise_seed}
  mutable:
    steps: {node_id: "132", input: steps}
    cfg: {node_id: "138", input: cfg}

runtime:
  experience_path: ../var/remote-h3-controller-20260914/experience.jsonl
  output_root: ../var/remote-h3-controller-20260914/benchmark
  tasks_path: ../examples/tasks.yaml
  target_path: targets/l40x4_h3_example.yaml

reward:
  alpha: 1.0
  beta: 0.2
  gamma: 0.2
  delta: 0.2

checkpoint_retention:
  policy: rejected_candidate_v1
  # Keep metadata and experience for the whole run, but only a small set of
  # completed weights. The active model is always included by the campaign.
  max_retained_checkpoints: 3

pipeline:
  enabled: true
  # One primary successor plus one isolated GPU-fill branch when the primary
  # operator is CPU-only.
  max_inflight: 2
  # Ordinary elastic rounds keep one live GPU lane for the local Controller;
  # an explicit gpu_count/min_gpu_count=4 plan prefetches its successor,
  # hands off the Controller, and temporarily claims all four cards.
  controller_overlap_gpus: 1
  prefetch_before_full_training: true
  # Keep transient scheduling jitter waitable, but hand a persistent zero-free
  # state back to the remote LLM quickly enough to avoid an idle overnight
  # campaign. The next call is hard-filtered to CPU-only prune/quantize.
  resource_wait_replan_after: 3
  comfyui_process_policy: on_demand
  comfyui_idle_shutdown_s: 30
  # Bound an orphaned ComfyUI lease after an SSH/campaign crash.  Normal H3
  # benchmark tasks renew the marker at each evaluation boundary.
  comfyui_lease_max_age_s: 21600
  power_target_w: 300

benchmark:
  splits: [heldout]
  # One independent ComfyUI process per task when a split has enough tasks.
  # The current heldout manifest has one task, so this safely uses only GPU0;
  # dev/all evaluations can dynamically fan out across all four cards after
  # the scheduler excludes active training and Controller leases.
  comfyui_workers:
    - {gpu_index: 0, port: 8188}
    - {gpu_index: 1, port: 8189}
    - {gpu_index: 2, port: 8190}
    - {gpu_index: 3, port: 8191}
  sampling_interval_s: 1.0
  evaluator_command: []
  evaluator_timeout_s: 180
  # A real held-out H3 task currently takes about 10 minutes on L40; keep a
  # finite upper bound so a stuck ComfyUI prompt cannot stall the campaign.
  task_timeout_s: 1200
  reset_backend_before_run: true
  comfyui_cache_policy: idle_release
  black_frame_rate_threshold: 0.0
  efficiency_thresholds:
    latency_s: 0.10
    peak_memory_gb: 0.05
    energy_j: 0.10

worker:
  enabled: true
  entrypoint: /home/intern/huangjiahao/Harness4H3-rsi/tools/h3_real_train_worker.py
  config_template: /home/intern/huangjiahao/Harness4H3-rsi/configs/a1-worker.l40x4-rsi-staging.json
  python: /home/intern/miniconda3/envs/comfy/bin/torchrun
  allowed_operators: [prune_blocks, distill, recovery_finetune, step_distill, dmd2, quantize]
  operator_entrypoints:
    prune_blocks: /home/intern/huangjiahao/Harness4H3-rsi/tools/h3_real_prune_worker.py
    distill: /home/intern/huangjiahao/Harness4H3-rsi/tools/h3_real_train_worker.py
    recovery_finetune: /home/intern/huangjiahao/Harness4H3-rsi/tools/h3_real_train_worker.py
    step_distill: /home/intern/huangjiahao/Harness4H3-rsi/tools/h3_real_train_worker.py
    dmd2: /home/intern/huangjiahao/Harness4H3-rsi/tools/h3_real_train_worker.py
    quantize: /home/intern/huangjiahao/Harness4H3-rsi/tools/h3_real_quantize_worker.py
  operator_launchers:
    prune_blocks: python
    distill: torchrun
    recovery_finetune: torchrun
    step_distill: torchrun
    dmd2: torchrun
    quantize: python
  quantized_bits: [8]
  max_steps: 32
